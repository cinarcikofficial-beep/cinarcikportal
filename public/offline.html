<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>Çevrimdışı — Marmara'nın İncisi</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#09090b;color:#e4e4e7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;text-align:center}
  .box{max-width:380px}
  img{width:96px;height:96px;border-radius:50%;margin-bottom:16px}
  h1{font-size:20px;margin:0 0 8px;color:#fff}
  p{font-size:14px;color:#a1a1aa;line-height:1.5;margin:0 0 20px}
  button{background:#10b981;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer}
  a{display:block;margin-top:14px;color:#34d399;font-size:13px}
</style>
</head>
<body>
<div class="box">
  <img src="/icons/icon-192.png" alt="Çınarcık">
  <h1>İnternet bağlantısı yok</h1>
  <p>Şu an çevrimdışısınız. Daha önce açtığınız sayfalar çevrimdışı da görüntülenebilir. Bağlantı gelince tekrar deneyin.</p>
  <button onclick="location.reload()">↻ Tekrar Dene</button>
  <a href="tel:112">🚨 Acil durumda: 112</a>
</div>

</html>
