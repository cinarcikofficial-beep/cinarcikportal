# Render free plan 15 dk trafiksiz uyur; uyursa ziyaretçi "Application loading"
# ekranını görür. Bu workflow 10 dakikada bir siteyi ping'leyerek instance'ı
# uyanık tutar. (UptimeRobot alternatifi — hesap gerekmez.)
name: keep-awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # elle test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 https://marmaraninincisi.com/)
          echo "HTTP $code"
          [ "$code" = "200" ]
